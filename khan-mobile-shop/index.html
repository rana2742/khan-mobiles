<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Khan Mobile Shop — Premium Mobile Accessories</title>

    <!--
      Only things NOT managed per-page by <SEO> (src/components/SEO.jsx) live here:
      title/description/canonical/og:title/og:description/og:image/twitter:title/
      twitter:description are all set by that component on every route, so
      duplicating them here would create two conflicting tags per page.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Khan Mobile Shop" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Prevent white flash on load -->
    <style>html { background-color: #F8FAFC; }</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
